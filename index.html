<body>
    <div id="amai-os-container">
        <noscript>
            <div
                style="text-align: center; padding: 20px; font-family: Arial, sans-serif; color: #333; background-color: #f4f4f4;">
                <h1>Bienvenido a AmaiOS</h1>
                <p>AmaiOS es una simulación interactiva de un sistema operativo web. **Requiere JavaScript para
                    funcionar correctamente.**</p>
                <p>Por favor, habilita JavaScript en tu navegador para experimentar todas las características de AmaiOS,
                    incluyendo su explorador de archivos, editor de código, terminal y juegos.</p>
                <p>Este es un proyecto de portafolio desarrollado por scastarnado.</p>
                <hr style="margin: 20px auto; width: 50%;">
                <h1>Welcome to AmaiOS</h1>
                <p>AmaiOS is an interactive web-based operating system simulation. **JavaScript is required for it to
                    function correctly.**</p>
                <p>Please enable JavaScript in your browser to experience all AmaiOS features, including its file
                    explorer, code editor, terminal, and games.</p>
                <p>This is a portfolio project developed by scastarnado.</p>
            </div>
        </noscript>
        <!-- El contenido dinámico se insertará aquí -->
    </div>

    <template id="window-template">
        <div class="window">
            <div id="top-border" class="top-border"></div>
            <div id="left-border" class="left-border"></div>
            <div id="right-border" class="right-border"></div>
            <div id="bottom-border" class="bottom-border"></div>
            <div id="top-right-corner" class="top-right-corner"></div>
            <div id="top-left-corner" class="top-left-corner"></div>
            <div id="bottom-right-corner" class="bottom-right-corner"></div>
            <div id="bottom-left-corner" class="bottom-left-corner"></div>
            <div class="window-header">
                <span class="window-icon"><i class="fas fa-question-circle"></i></span>
                <span class="window-title">Ventana</span>
                <div class="window-controls">
                    <button class="window-control-button minimize-button" aria-label="Minimizar" title="Minimizar"><i
                            class="fas fa-window-minimize"></i></button>
                    <button class="window-control-button maximize-button" aria-label="Maximizar" title="Maximizar"><i
                            class="far fa-square"></i></button>
                    <button class="window-control-button close-button" aria-label="Cerrar" title="Cerrar"><i
                            class="fas fa-times"></i></button>
                </div>
            </div>
            <div class="window-content">
                <!-- Contenido de la aplicación -->
            </div>
        </div>
    </template>

    <script src="js/main.js" type="module"></script>
    <script src="js/service-worker-control.js" defer></script>
